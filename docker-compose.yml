services:
  backend:
    build: ./backend_python
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
